rules:
  # Bronze
  action-setup:
    status: done
    comment: Registers set_group_state and set_pump_mode admin services in __init__.py.
  appropriate-polling:
    status: exempt
    comment: Integration intentionally keeps a user-configurable local polling interval as a design decision for varied pool equipment and network conditions; defaults remain conservative and local-only.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: done
    comment: README documents the set_group_state and set_pump_mode services with examples.
  docs-high-level-description:
    status: done
    comment: Covered in README, but should be tightened when the user guide is written.
  docs-installation-instructions:
    status: done
    comment: README now documents HACS installation and the initial local linking flow.
  docs-removal-instructions:
    status: done
    comment: README now documents how to remove the integration from Home Assistant.
  entity-event-setup:
    status: exempt
    comment: Entities are coordinator-polled and do not subscribe to standalone event streams.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: Services are registered via async_register_admin_service, which enforces admin-only access.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: README documents the configurable polling interval and where to change it in Home Assistant.
  docs-installation-parameters:
    status: done
    comment: README documents the required setup input of the PoolSync device IP address.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: Current automated coverage is 91 percent. Work is intentionally paused here for now, with a later target of 95 percent.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: No discovery flow is implemented today, so there is no discovered connection info to update.
  discovery:
    status: exempt
    comment: This local integration currently relies on manual IP-based setup rather than network discovery.
  docs-data-update:
    status: done
    comment: README documents the configurable polling interval and the optimistic-update behavior of write controls.
  docs-examples:
    status: done
    comment: README includes service examples for set_group_state and set_pump_mode.
  docs-known-limitations:
    status: done
    comment: README now includes a dedicated known limitations section for discovery, linking, reported equipment, and dynamic device handling.
  docs-supported-devices:
    status: done
    comment: README now describes the supported PoolSync controller, ChlorSync, and supported heat-pump surfaces at a high level.
  docs-supported-functions:
    status: done
    comment: README now summarizes the main monitoring, control, and diagnostics surfaces exposed by the integration.
  docs-troubleshooting:
    status: done
    comment: README now includes a focused troubleshooting section covering setup, connectivity, Wi-Fi quality, diagnostics, and logs.
  docs-use-cases:
    status: done
    comment: README now includes a "Common use cases" section covering group durations, pump control, schedules, and heat-pump automation.
  dynamic-devices:
    status: done
    comment: Multiple devices of the same type (e.g., 2x ChlorSync, multiple heat pumps) are fully supported via dict-based PoolSyncParsedData.devices with sorted iteration and nodeAddr-based disambiguation. Entities are created per detected device instance.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations:
    status: done
    comment: User-facing HomeAssistantError messages are backed by translation keys in translations/en.json under the exceptions section.
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: A reconfigure flow lets users change the device IP address without removing and re-adding the integration.
  repair-issues:
    status: done
    comment: A repair issue is created when authentication fails, guiding users to reauthenticate the integration.
  stale-devices:
    status: todo
    comment: The integration creates role devices but does not yet remove stale ones automatically.

  # Platinum
  async-dependency:
    status: done
    comment: The integration uses async aiohttp-based I/O and does not rely on blocking network libraries.
  inject-websession:
    status: done
    comment: The API client is constructed with a Home Assistant-managed aiohttp session.
  strict-typing:
    status: todo
    comment: Typing is improved, but the repo is not yet at a strict platinum typing standard.
